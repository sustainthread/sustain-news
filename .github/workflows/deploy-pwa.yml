name: Update PWA Cache Version

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly, Sunday 00:00 UTC

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Bump service worker cache version
      run: |
        set -euo pipefail
        NEW_VERSION="v$(date +%s)"
        sed -i -E "s/^const CACHE_VERSION = '[^']*';/const CACHE_VERSION = '${NEW_VERSION}';/" sw.js
        grep -q "const CACHE_VERSION = '${NEW_VERSION}';" sw.js || {
          echo "::error::CACHE_VERSION not found in sw.js - the bump pattern is out of date"
          exit 1
        }
        echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

    - name: Commit and push if changed
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add sw.js
        git diff --staged --quiet || (git commit -m "🔄 Update PWA cache version to ${NEW_VERSION}" && git push)
